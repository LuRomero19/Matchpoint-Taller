{% with turno=actividad.evento.turno %}
<a class="portal-actividad" href="{% url ruta actividad.pk %}">
    <div><strong>{{ turno.hora_inicio|time:"H:i" }}–{{ turno.hora_fin|time:"H:i" }}</strong><span>{{ turno.fecha|date:"l j \d\e F"|capfirst }}</span></div>
    <div><span>{{ turno.cancha.sede.nombre }}</span><small>{{ turno.cancha.nombre }}</small></div>
</a>
{% endwith %}
